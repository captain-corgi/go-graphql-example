version: 2.1

# Define orbs for easy integrations
orbs:
  slack: circleci/slack@4.12.5

# Define reusable commands
commands:
  # Install Go dependencies
  install-deps:
    steps:
      - run:
          name: Install Go dependencies
          command: |
            go mod download
            go mod verify

  # Run linting
  run-lint:
    steps:
      - run:
          name: Run linting
          command: make lint

# Define reusable jobs
jobs:
  # Lint job
  lint:
    docker:
      - image: cimg/go:1.24.3
    working_directory: ~/project
    steps:
      - checkout
      - install-deps
      - run-lint
      - slack/notify:
          event: pass
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Go GraphQL Example - Linting Passed!*\n\n*Project:* $CIRCLE_PROJECT_REPONAME\n*Branch:* $CIRCLE_BRANCH\n*Commit:* <https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/commit/$CIRCLE_SHA1|${CIRCLE_SHA1:0:7}>\n*Author:* $CIRCLE_USERNAME"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Pipeline"
                      },
                      "url": "$CIRCLE_BUILD_URL"
                    }
                  ]
                }
              ]
            }
      - slack/notify:
          event: fail
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Go GraphQL Example - Linting Failed!*\n\n*Project:* $CIRCLE_PROJECT_REPONAME\n*Branch:* $CIRCLE_BRANCH\n*Commit:* <https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/commit/$CIRCLE_SHA1|${CIRCLE_SHA1:0:7}>\n*Author:* $CIRCLE_USERNAME"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Logs"
                      },
                      "url": "$CIRCLE_BUILD_URL"
                    }
                  ]
                }
              ]
            }

  # Test job (optional - can be added later)
  test:
    docker:
      - image: cimg/go:1.24.3
    working_directory: ~/project
    steps:
      - checkout
      - install-deps
      - run:
          name: Run tests
          command: make test
      - run:
          name: Generate coverage report
          command: make coverage
      - store_test_results:
          path: coverage.out
      - store_artifacts:
          path: coverage.html
          destination: coverage-report
      - slack/notify:
          event: pass
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Go GraphQL Example - Tests Passed!*\n\n*Project:* $CIRCLE_PROJECT_REPONAME\n*Branch:* $CIRCLE_BRANCH\n*Commit:* <https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/commit/$CIRCLE_SHA1|${CIRCLE_SHA1:0:7}>\n*Author:* $CIRCLE_USERNAME"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Pipeline"
                      },
                      "url": "$CIRCLE_BUILD_URL"
                    }
                  ]
                }
              ]
            }
      - slack/notify:
          event: fail
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Go GraphQL Example - Tests Failed!*\n\n*Project:* $CIRCLE_PROJECT_REPONAME\n*Branch:* $CIRCLE_BRANCH\n*Commit:* <https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/commit/$CIRCLE_SHA1|${CIRCLE_SHA1:0:7}>\n*Author:* $CIRCLE_USERNAME"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Logs"
                      },
                      "url": "$CIRCLE_BUILD_URL"
                    }
                  ]
                }
              ]
            }

# Define workflows
workflows:
  # Main workflow for PRs to main branch
  pr-to-main:
    jobs:
      - lint:
          context: slack-context
          filters:
            branches:
              only: main
      - test:
          context: slack-context
          requires:
            - lint
          filters:
            branches:
              only: main

  # Workflow for cursor-review tag
  cursor-review:
    jobs:
      - lint:
          context: slack-context
          filters:
            tags:
              only: /^cursor-review$/
      - test:
          context: slack-context
          requires:
            - lint
          filters:
            tags:
              only: /^cursor-review$/

  # Workflow for any PR (with cursor-review tag)
  pr-with-cursor-review:
    jobs:
      - lint:
          context: slack-context
          filters:
            branches:
              ignore: main
      - test:
          context: slack-context
          requires:
            - lint
          filters:
            branches:
              ignore: main
